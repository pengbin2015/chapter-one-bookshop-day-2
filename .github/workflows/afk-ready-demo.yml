name: AFK ready demo

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  explain-afk-flow:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'afk-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show intended AFK pipeline
        run: |
          echo "Eligible issue label: afk-ready"
          echo "This workflow describes the process and validates this repository; it does not dispatch agents or open PRs."
          echo "Entrypoint custom agent: .github/agents/orchestrator.agent.md"
          echo "Pipeline:"
          echo "1. Orchestrator reads the issue."
          echo "2. Orchestrator verifies scope, plan, approval evidence, and authorized assignment."
          echo "3. Implementer edits the code with TDD (shipping-a-feature, AFK mode)."
          echo "4. Reviewer runs format, lint, typecheck, tests, and security checks."
          echo "5. The configured agent integration opens a PR and requests the team's review sequence."
          echo "6. Human performs the second review."

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dependency security audit
        run: npm audit --audit-level=high
