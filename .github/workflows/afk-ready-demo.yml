name: AFK ready demo

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  explain-afk-flow:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'afk-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show intended AFK pipeline
        run: |
          echo "Eligible issue label: afk-ready"
          echo "Entrypoint custom agent: .github/agents/orchestrator.agent.md"
          echo "Pipeline:"
          echo "1. Orchestrator reads the issue."
          echo "2. Orchestrator confirms the issue is small, clear, and testable."
          echo "3. Implementer edits the code."
          echo "4. Tester runs format, lint, typecheck, tests, and security checks."
          echo "5. Automation opens a PR and asks Copilot to review first."
          echo "6. Human performs the second review."

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dependency security audit
        run: npm audit --audit-level=high
