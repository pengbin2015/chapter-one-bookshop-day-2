# Starts Copilot cloud agent when a maintainer labels an issue `ready-for-agent`.
# Demo-grade: the label from a user with write access is the approval.
# Editing an approved issue removes the label, so the approved text and the text
# Copilot receives cannot drift apart.
# Needs repository secret AGENT_TOKEN: a fine-grained personal access token
# (this repo; Metadata read; Actions, Contents, Issues, Pull requests read/write).
name: Assign issue to agent

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: assign-agent-${{ github.event.issue.number }}

jobs:
  revoke:
    if: github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Withdraw the approval label and say why
        run: |
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label ready-for-agent
          gh issue comment "$ISSUE" --repo "$REPO" --body "This issue changed after it was approved, so the \`ready-for-agent\` label was removed. A maintainer must read the current text and apply the label again to start the agent."

  assign:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      BASE: ${{ github.event.repository.default_branch }}
      CUSTOM_AGENT: orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Check the label came from someone with write access
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)
          echo "$SENDER has $perm access"
          case "$perm" in
            admin|maintain|write) ;;
            *) echo "::error::Only users with write access can start the agent."; exit 1 ;;
          esac

      - name: Read the issue as it stands now
        run: |
          gh api "repos/$REPO/issues/$ISSUE" > issue.json
          jq -r '.body // ""' issue.json > issue-body.md
          if [ "$(jq -r '.state' issue.json)" != "open" ]; then
            echo "::error::The issue is not open."; exit 1
          fi
          # Validate what the API returns now, not the label event payload, which can already be stale.
          echo "BODY_SHA=$(sha256sum issue-body.md | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Check every required section is present and complete
        run: |
          missing=0
          while IFS= read -r heading; do
            grep -qF "$heading" issue-body.md || { echo "::error::Missing section: $heading"; missing=1; }
          done <<'HEADINGS'
          ### Goal and desired behaviour
          ### Acceptance criteria
          ### Scope and non-goals
          ### Technical context
          ### Implementation plan
          ### Checks
          HEADINGS
          if grep -qF "_No response_" issue-body.md; then
            echo "::error::A required section is empty."; missing=1
          fi
          if grep -qE '^[[:space:]]*- \[ \]' issue-body.md; then
            echo "::error::Every Readiness box must be ticked before approval."; missing=1
          fi
          ticked=$(grep -cE '^[[:space:]]*- \[[xX]\]' issue-body.md || true)
          if [ "$ticked" -lt 3 ]; then
            echo "::error::Expected the 3 Readiness boxes to be ticked; found $ticked."; missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Check the custom agent and Copilot are both available
        run: |
          if [ ! -f ".github/agents/${CUSTOM_AGENT}.agent.md" ]; then
            echo "::error::No .github/agents/${CUSTOM_AGENT}.agent.md on $BASE; custom_agent must name a real agent file."; exit 1
          fi
          logins=$(gh api graphql \
            -H 'GraphQL-Features: issues_copilot_assignment_api_support' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:100){nodes{login}}}}' \
            --jq '.data.repository.suggestedActors.nodes[].login')
          if ! grep -qx 'copilot-swe-agent' <<<"$logins"; then
            echo "::error::Copilot cloud agent is not assignable in this repository. Enable it first."; exit 1
          fi

      - name: Assign Copilot with the orchestrator agent
        run: |
          jq -n --arg repo "$REPO" --arg base "$BASE" --arg issue "$ISSUE" \
                --arg sender "$SENDER" --arg agent "$CUSTOM_AGENT" '{
            assignees: ["copilot-swe-agent[bot]"],
            agent_assignment: {
              target_repo: $repo,
              base_branch: $base,
              custom_agent: $agent,
              custom_instructions: ("Use shipping-a-feature in approved-issue mode for issue #" + $issue
                + ". The ready-for-agent label applied by @" + $sender + " is the recorded approval."
                + " Execute only the approved plan, open a pull request when the review evidence is ready, and do not merge."
                + " If named subagents are unavailable here, review your own work against the acceptance criteria,"
                + " say so plainly in the pull request, and leave independent review to CI and the human reviewer.")
            }
          }' | gh api --method POST "repos/$REPO/issues/$ISSUE/assignees" --input -

      - name: Confirm the assignment landed and the text did not move
        run: |
          gh api "repos/$REPO/issues/$ISSUE" > after.json
          if ! jq -r '.assignees[].login' after.json | grep -qi 'copilot'; then
            echo "::error::Copilot was not assigned. Check AGENT_TOKEN permissions and the API response above."; exit 1
          fi
          if [ "$(jq -r '.body // ""' after.json | sha256sum | cut -d' ' -f1)" != "$BODY_SHA" ]; then
            echo "::error::The issue was edited during assignment. Review the new text and approve it again."; exit 1
          fi
          echo "Assigned with custom_agent=$CUSTOM_AGENT and base=$BASE"

      - name: Record the approval on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "Approved by @$SENDER with the \`ready-for-agent\` label. Assigned to Copilot with the \`$CUSTOM_AGENT\` agent (base: \`$BASE\`, approved body \`sha256:$BODY_SHA\`). Editing this issue removes the label and needs a fresh approval. A developer reviews and merges the pull request."
