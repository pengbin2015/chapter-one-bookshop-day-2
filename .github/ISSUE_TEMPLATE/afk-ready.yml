name: AFK-ready implementation ticket
description: Create a small, well-defined issue that the AFK agent pipeline can plan, implement, test, and review.
title: "[AFK] "
labels: ["afk-ready"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for work that is small, clear, and testable enough for one unattended AFK run.

        Good AFK tickets fit inside the agent's smart context zone: one behaviour change, clear acceptance criteria, known files or surfaces, and no hidden product decisions.

  - type: input
    id: intent-feature
    attributes:
      label: Requirement or feature reference
      description: Link the parent requirement or feature identifier, if applicable.
      placeholder: "Feature identifier or requirements link"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What user or developer problem should this issue solve?
      placeholder: "Who is affected, what happens today, and why should it change?"
    validations:
      required: true

  - type: textarea
    id: desired-behaviour
    attributes:
      label: Desired behaviour
      description: Describe the expected behaviour after the change. Include API paths, UI states, or data changes when relevant.
      placeholder: |
        Describe the trigger, expected outcome, and relevant failure behavior.
        Reference established interfaces and conventions where applicable.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List objective checks the reviewer can verify.
      placeholder: |
        - Observable successful outcome and how to verify it.
        - Expected behavior for invalid input or a relevant failure case.
        - Existing behavior that must continue to work.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: State what is in scope and out of scope so the agent does not guess.
      placeholder: |
        In scope:
        - Components and behavior covered by this issue.
        - Required tests and documentation.

        Out of scope:
        - Adjacent features and unrelated changes.
    validations:
      required: true

  - type: textarea
    id: technical-context
    attributes:
      label: Technical context
      description: Point the agent to relevant files, conventions, docs, or existing behaviour.
      placeholder: |
        Relevant files:
        - Existing implementation and test paths.
        - Applicable repository instructions and architecture decisions.
        - Requirement or design references.

        Identify constraints from this project rather than assuming a stack.
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Expected tests and checks
      description: Name the tests or verification commands expected before PR handoff.
      placeholder: |
        List exact commands from this project’s instructions and CI.
        Identify expected results and required platform checks.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks or edge cases
      description: List cases the agent should consider, or state "None known."
      placeholder: |
        - Invalid or missing input.
        - Partial failures, retries, or compatibility concerns where relevant.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Explicitly list tempting work the agent must not do.
      placeholder: |
        - Features explicitly deferred from this issue.
        - Components or interfaces that must remain unchanged.
    validations:
      required: true

  - type: textarea
    id: implementation-plan
    attributes:
      label: Implementation plan
      description: Provide the approved phases, affected paths, acceptance criteria per phase, and checks.
    validations:
      required: true

  - type: textarea
    id: approval-evidence
    attributes:
      label: Approval evidence
      description: Link the approval record and identify the approved scope/version under your team's policy. Complete this before unattended assignment.
    validations:
      required: true

  - type: checkboxes
    id: afk-readiness
    attributes:
      label: AFK readiness checklist
      description: Check every item before applying or keeping the `afk-ready` label.
      options:
        - label: This issue describes one small behaviour change.
          required: true
        - label: Acceptance criteria are objective and testable.
          required: true
        - label: Scope boundaries and non-goals are explicit.
          required: true
        - label: Relevant files or code areas are named.
          required: true
        - label: Required verification commands are listed.
          required: true
        - label: The implementation plan and scope are approved under the team's policy.
          required: true
        - label: No secrets, external accounts, payment providers, or production data are required.
          required: true
