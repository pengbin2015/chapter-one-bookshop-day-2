name: AFK-ready implementation ticket
description: Create a small, well-defined issue that the AFK agent pipeline can plan, implement, test, and review.
title: "[AFK] "
labels: ["afk-ready"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for work that is small, clear, and testable enough for one unattended AFK run.

        Good AFK tickets fit inside the agent's smart context zone: one behaviour change, clear acceptance criteria, known files or surfaces, and no hidden product decisions.

  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What user or developer problem should this issue solve?
      placeholder: "Customers need to create an empty cart so later requests can add books to it."
    validations:
      required: true

  - type: textarea
    id: desired-behaviour
    attributes:
      label: Desired behaviour
      description: Describe the expected behaviour after the change. Include API paths, UI states, or data changes when relevant.
      placeholder: |
        POST /api/cart returns 201 with a generated cartId and an empty items array.
        GET /api/cart/:cartId returns the same empty cart.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List objective checks the tester and reviewer can verify.
      placeholder: |
        - POST /api/cart returns 201 and JSON with cartId, items, and total.
        - GET /api/cart/:cartId returns 200 for an existing cart.
        - GET /api/cart/:cartId returns 404 with { error } for an unknown cart.
        - Existing book and health tests still pass.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: State what is in scope and out of scope so the agent does not guess.
      placeholder: |
        In scope:
        - In-memory cart storage.
        - API tests for create and fetch cart.

        Out of scope:
        - Authentication.
        - Payment.
        - Browser persistence.
        - Checkout.
    validations:
      required: true

  - type: textarea
    id: technical-context
    attributes:
      label: Technical context
      description: Point the agent to relevant files, conventions, docs, or existing behaviour.
      placeholder: |
        Relevant files:
        - src/app.ts
        - src/store.ts
        - src/routes/books.ts
        - tests/books.test.ts
        - .github/instructions/backend.instructions.md

        Follow AGENTS.md guardrails: no database, no new dependencies, JSON { error } for API errors.
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Expected tests and checks
      description: Name the tests or verification commands expected before PR handoff.
      value: |
        Required commands:
        - npm run format:check
        - npm run lint
        - npm run typecheck
        - npm test
        - npm audit --audit-level=high
      placeholder: "Add route tests in tests/cart.test.ts for create, fetch, and unknown cart."
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks or edge cases
      description: List cases the agent should consider, or state "None known."
      placeholder: |
        - Unknown cart id should be 404, not an empty new cart.
        - cartId should not collide with existing carts during one process lifetime.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Explicitly list tempting work the agent must not do.
      placeholder: |
        - Do not build checkout in this ticket.
        - Do not add frontend cart UI yet.
        - Do not introduce sessions, auth, or database persistence.
    validations:
      required: true

  - type: checkboxes
    id: afk-readiness
    attributes:
      label: AFK readiness checklist
      description: Check every item before applying or keeping the `afk-ready` label.
      options:
        - label: This issue describes one small behaviour change.
          required: true
        - label: Acceptance criteria are objective and testable.
          required: true
        - label: Scope boundaries and non-goals are explicit.
          required: true
        - label: Relevant files or code areas are named.
          required: true
        - label: Required verification commands are listed.
          required: true
        - label: No secrets, external accounts, payment providers, or production data are required.
          required: true
